<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ebe4d6">
  <title>일기장</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500&family=Noto+Serif+KR:wght@400;700&display=swap">
  <link rel="stylesheet" href="page-flip.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="reader" id="reader">
    <div class="topbar">
      <span class="title">일기장</span>
      <form class="search" id="searchForm" role="search">
        <input type="search" id="searchInput" placeholder="일기 검색 (예: 11-01, 혼자)" aria-label="일기 검색" autocomplete="off" enterkeyhint="search">
      </form>
      <div class="actions">
        <button type="button" class="btn btnNew" id="new">새 일기</button>
        <button type="button" class="btn" id="mode" disabled>편집모드</button>
      </div>
    </div>
    <div class="book" id="book" aria-label="일기장 펼침면"></div>
    <button type="button" class="turn turnPrev" id="prev" aria-label="앞 쪽">‹</button>
    <button type="button" class="turn turnNext" id="next" aria-label="다음 쪽">›</button>
    <div class="msg" id="msg">일기장을 펼치는 중…</div>
  </main>
  <div class="popup" id="popup" hidden>
    <div class="popupBox" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
      <div class="popupHead">
        <span id="popupTitle"></span>
        <button type="button" class="popupClose" id="popupClose" aria-label="닫기">×</button>
      </div>
      <ul class="results" id="results"></ul>
    </div>
  </div>
  <script src="page-flip.js"></script>
  <script src="app.js"></script>
</body>
</html>
